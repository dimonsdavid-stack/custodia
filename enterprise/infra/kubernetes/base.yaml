apiVersion: v1
kind: Namespace
metadata:
  name: custodia
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custodia
  namespace: custodia
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: custodia
  namespace: custodia
spec:
  selector:
    app: custodia
    release: stable
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: custodia
  namespace: custodia
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: custodia
      release: stable
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: custodia-containment
  namespace: custodia
spec:
  podSelector:
    matchLabels:
      app: custodia
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: custodia-probe
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              custodia.io/dependency: trusted
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: custodia-egress
          podSelector:
            matchLabels:
              app: custodia-egress-proxy
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: custodia
  namespace: custodia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: custodia-stable
  minReplicas: 3
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
